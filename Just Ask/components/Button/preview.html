<!-- @dsCard group="Actions" height=330 subtitle="Primary button — default, hover, focus, pressed; on navy" -->
<div class="ja-root pv">
  <link rel="stylesheet" href="../../components/Button/style.css"><link rel="stylesheet" href="../../components/ActionLink/style.css">
  <style>
    .pv{padding:24px;display:grid;grid-template-columns:repeat(4,max-content);gap:16px 24px;align-items:center}
    .pv .cap{font:600 12px/16px var(--font-sans);color:var(--text-muted);margin-top:8px}
    .pv .band{grid-column:1/-1;background:var(--surface-inverse);padding:24px;border-radius:var(--radius-md);display:flex;gap:24px;align-items:center}
  </style>
  <div><a class="ja-button" href="#">Just Ask</a><div class="cap">Default · action-primary-default</div></div>
  <div><a class="ja-button is-hover" href="#">Just Ask</a><div class="cap">Hover · action-primary-hover</div></div>
  <div><a class="ja-button is-focus" href="#">Just Ask</a><div class="cap">Focus · 2px border-focus</div></div>
  <div><a class="ja-button is-pressed" href="#">Just Ask</a><div class="cap">Pressed · action-primary-pressed</div></div>
  <div class="band ja-on-inverse">
    <a class="ja-button" href="#">Just Ask</a>
    <a class="ja-button is-focus" href="#">Just Ask</a>
    <a class="ja-link ja-link--inverse ja-link--strong" href="#">Share With a Colleague&nbsp;<svg class="ja-arrow" viewBox="0 0 10.8 21.6" aria-hidden="true" focusable="false"><path d="M0.88 12.06h6.44v1.96H0.88zM4.35 17.12l2.45-4.09-2.45-4.05h2.43l2.66 4.05-2.66 4.09zM0 20.25h10.8v0.9H0z"/></svg></a>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:24px 0 0">
    <a class="ja-button ja-button--outline" href="#">View Guide</a>
    <a class="ja-button ja-button--outline is-hover" href="#">View Guide</a>
    <span class="ja-small" style="color:var(--text-muted)">Outline (Nov 20) — default, hover. For repeated actions such as ResourceCard.</span>
  </div>
  <script>document.querySelectorAll('.pv a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault()})})</script>
</div>
